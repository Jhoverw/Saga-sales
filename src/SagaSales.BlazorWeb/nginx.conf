# Serves the Blazor WebAssembly app: every unknown route falls back to index.html,
# because routing happens in the browser.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No caching for the host page, so a new build is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # The framework files must always match the host page that loaded them. A stale
    # blazor.webassembly.js paired with a newer dotnet.*.js fails at render with
    # "Cannot read properties of undefined (reading 'getI32')".
    location /_framework/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
