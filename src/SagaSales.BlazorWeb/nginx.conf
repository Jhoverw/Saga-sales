# Serves the Blazor WebAssembly app: every unknown route falls back to index.html,
# because routing happens in the browser.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No caching for the host page, so a new build is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
