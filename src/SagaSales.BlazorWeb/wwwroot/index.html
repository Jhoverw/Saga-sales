<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saga-Sales</title>
    <base href="/" />

    <!-- No web fonts: the first paint must never wait on a third-party host. -->

    <!-- Bootstrap is used only for the 12-column grid and a few utilities, and it is loaded
         NON-BLOCKING on purpose: if the CDN is slow or unreachable the app still paints. -->
    <link rel="preload" as="style"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    </noscript>

    <!-- Icons are inline SVG inside the components (no icon font, no third-party host): the
         panel must render its navigation even when the machine has no internet access. -->

    <link href="css/app.css" rel="stylesheet" />

<!-- Font Awesome 6 CDN (free) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* Self-contained splash: no external CSS needed to show something immediately. */
        @keyframes saga-spin { to { transform: rotate(360deg); } }
        .saga-splash {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0b0f1a;
            color: #e6eefc;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        .saga-splash__ring {
            width: 34px;
            height: 34px;
            margin: 0 auto 16px;
            border: 3px solid rgba(31, 111, 235, 0.25);
            border-top-color: #2dd4ff;
            border-radius: 50%;
            animation: saga-spin 0.9s linear infinite;
        }
        .saga-splash__text {
            font-size: 12px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.65;
        }
        /* Boot diagnostics: if the app cannot start, the reason is shown here instead of
           leaving the user staring at the spinner with nothing to report. */
        #saga-boot-error {
            display: none;
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: 45vh;
            overflow: auto;
            margin: 0;
            padding: 16px 20px;
            background: #12050a;
            border-top: 2px solid #f26d6d;
            color: #ffd9d9;
            font: 12px/1.5 ui-monospace, Consolas, monospace;
            white-space: pre-wrap;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="saga-splash">
            <div style="text-align:center">
                <div class="saga-splash__ring"></div>
                <div class="saga-splash__text">Cargando Saga-Sales</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        <span>Ha ocurrido un error inesperado.</span>
        <a href="" class="reload">Recargar</a>
    </div>

    <pre id="saga-boot-error"></pre>

    <script>
        // Storage facade over localStorage, and a visible diagnostics panel for the boot phase.
        (function () {
            var panel = null;

            function show(prefix, message) {
                panel = panel || document.getElementById('saga-boot-error');
                if (!panel) { return; }
                panel.style.display = 'block';
                panel.textContent += prefix + ': ' + message + '\n';
            }

            window.sagaBootError = function (message) { show('ARRANQUE', message); };

            window.addEventListener('error', function (event) {
                // Script load failures arrive without a message, so name the target instead.
                if (event.message) {
                    show('ERROR', event.message + (event.filename ? '  @ ' + event.filename : ''));
                }
            });

            window.addEventListener('unhandledrejection', function (event) {
                var reason = event.reason;
                show('PROMESA', (reason && (reason.message || reason)) || 'rechazo sin detalle');
            });

            window.sagaStorage = {
                get: function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
                set: function (key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } },
                remove: function (key) { try { localStorage.removeItem(key); return true; } catch (e) { return false; } }
            };
        })();
    </script>

    <!-- QR for receipts (H-06). Vendored: MIT, Kazuhiko Arase, see wwwroot/lib/qrcode/qrcode.js. -->
    <script src="lib/qrcode/qrcode.js"></script>
    <script>
        // Returns an <img> tag with the QR for the given text (the order number only).
        window.sagaQrHtml = function (text) {
            var qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            return qr.createImgTag(4, 8, 'QR ' + text);
        };
        window.sagaPrint = function () { window.print(); };
        // Keeps the cashier's hands on the keyboard: returns the cursor to an element by id.
        window.sagaFocus = function (id) { var el = document.getElementById(id); if (el) el.focus(); };
        // Saves a file the app built in memory (for example a CSV report).
        window.sagaDownload = function (fileName, contentType, base64) {
            var link = document.createElement('a');
            link.href = 'data:' + contentType + ';base64,' + base64;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
        };
    </script>
    <script src="_framework/blazor.webassembly.js" autostart="false"
            onerror="window.sagaBootError('no se pudo cargar _framework/blazor.webassembly.js (404)')"></script>
    <script>
        // Every browser starts in es-EC: Ecuadorian dates, and only the culture data the app needs.
        // Program.cs then sets the point as decimal separator without renaming the culture.
        if (window.Blazor) {
            Blazor.start({ applicationCulture: 'es-EC' })
                .catch(function (e) { window.sagaBootError('Blazor.start: ' + ((e && e.message) || e)); });
        }
    </script>
<footer class="build-footer" style="position:fixed;bottom:0;width:100%;text-align:center;background:#0008;color:white;font-size:0.8rem;">Build: <span id="build-stamp">…</span></footer>
<script>
  // One source for every build label on screen: the file written by the image build (scripts/build-label.ps1).
  window.sagaBuildLabelPromise = fetch('/assets/build-id.txt', { cache: 'no-store' })
    .then(r => r.text())
    .then(t => t.trim() || 'desconocido')
    .catch(() => 'no disponible');
  window.sagaBuildLabelPromise.then(label => { document.getElementById('build-stamp').textContent = label; });
  window.sagaReadBuildLabel = () => window.sagaBuildLabelPromise;
</script>
</body>
</html>
