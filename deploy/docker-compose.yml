# Saga-Sales — local stack.
# Database: SQL Server 2022. There are no migrations: apply db/<service>/V###__*.sql with
# scripts/apply-db.ps1 (it creates each database on first run).
version: '3.8'

# Shared by every .NET service so the stack is configured in one place.
x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: "http://+:80"
  Jwt__Issuer: "SagaSales.Identity"
  Jwt__Audience: "SagaSales.Api"
  # Every service needs the same signing key to validate the tokens the gateway accepts.
  Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Username: saga_sales
  RabbitMQ__Password: saga_sales_dev
  Seq__ServerUrl: "http://seq:5341"

x-app-depends: &app-depends
  sqlserver:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  # ── Infrastructure ────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saga-sales-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - saga-sales-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: saga-sales-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: saga_sales
      RABBITMQ_DEFAULT_PASS: saga_sales_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saga-sales-network

  seq:
    image: datalust/seq:2024.2
    container_name: saga-sales-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq_data:/data
    networks:
      - saga-sales-network

  # ── Services ──────────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ..
      dockerfile: src/SagaSales.ApiGateway/Dockerfile
    container_name: saga-sales-api-gateway
    environment:
      <<: *app-env
    ports:
      - "5000:80"
    depends_on:
      <<: *app-depends
      identity:
        condition: service_started
    networks:
      - saga-sales-network

  identity:
    build:
      context: ..
      dockerfile: src/SagaSales.Identity/Dockerfile
    container_name: saga-sales-identity
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=saga_identity;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
    ports:
      - "5001:80"
    depends_on: *app-depends
    networks:
      - saga-sales-network

  catalog:
    build:
      context: ..
      dockerfile: src/SagaSales.Catalog/Dockerfile
    container_name: saga-sales-catalog
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=saga_catalog;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
    ports:
      - "5002:80"
    depends_on: *app-depends
    networks:
      - saga-sales-network

  sales:
    build:
      context: ..
      dockerfile: src/SagaSales.Sales/Dockerfile
    container_name: saga-sales-sales
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=saga_sales;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
      Services__Catalog: "http://catalog:80"
    ports:
      - "5003:80"
    depends_on:
      <<: *app-depends
      catalog:
        condition: service_started
    networks:
      - saga-sales-network

  payment:
    build:
      context: ..
      dockerfile: src/SagaSales.Payment/Dockerfile
    container_name: saga-sales-payment
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=saga_payment;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
      Payments__Provider: Stub
      Stripe__SecretKey: "${STRIPE_SECRET_KEY}"
      Stripe__PublishableKey: "${STRIPE_PUBLISHABLE_KEY}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET}"
      PayPal__ClientId: "${PAYPAL_CLIENT_ID}"
      PayPal__ClientSecret: "${PAYPAL_CLIENT_SECRET}"
      PayPal__Mode: sandbox
    ports:
      - "5004:80"
    depends_on: *app-depends
    networks:
      - saga-sales-network

  customer:
    build:
      context: ..
      dockerfile: src/SagaSales.Customer/Dockerfile
    container_name: saga-sales-customer
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=saga_customer;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
    ports:
      - "5005:80"
    depends_on: *app-depends
    networks:
      - saga-sales-network

  analytics:
    build:
      context: ..
      dockerfile: src/SagaSales.Analytics/Dockerfile
    container_name: saga-sales-analytics
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=saga_analytics;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
    ports:
      - "5006:80"
    depends_on: *app-depends
    networks:
      - saga-sales-network

  notification:
    build:
      context: ..
      dockerfile: src/SagaSales.Notification/Dockerfile
    container_name: saga-sales-notification
    environment:
      <<: *app-env
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=saga_notification;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SagaSales_Dev_2026!};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:-SagaSales-dev-signing-key-please-replace-in-production-2026}"
      Notifications__OpsPhone: "${OPS_PHONE}"
      Email__SmtpHost: "${EMAIL_SMTP_HOST}"
      Email__SmtpPort: "${EMAIL_SMTP_PORT}"
      Email__Username: "${EMAIL_USERNAME}"
      Email__Password: "${EMAIL_PASSWORD}"
      Email__FromAddress: "${EMAIL_FROM_ADDRESS}"
      Twilio__AccountSid: "${TWILIO_ACCOUNT_SID}"
      Twilio__AuthToken: "${TWILIO_AUTH_TOKEN}"
      Twilio__FromNumber: "${TWILIO_FROM_NUMBER}"
    ports:
      - "5007:80"
    depends_on: *app-depends
    networks:
      - saga-sales-network

  blazor-web:
    build:
      context: ..
      dockerfile: src/SagaSales.BlazorWeb/Dockerfile
    container_name: saga-sales-blazor-web
    ports:
      - "5008:80"
    depends_on:
      - api-gateway
    networks:
      - saga-sales-network

volumes:
  sqlserver_data:
  rabbitmq_data:
  seq_data:

networks:
  saga-sales-network:
    driver: bridge
